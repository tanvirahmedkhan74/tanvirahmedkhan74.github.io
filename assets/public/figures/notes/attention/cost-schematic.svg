<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d"><title id="t">Schematic cost comparison</title><desc id="d">Four schematic panels: dense n by n score square, sliding window band n by w, fixed d by d recurrent state, and a decode KV cache of n by d for keys and values. A footer states FlashAttention is exact and leaves the cost class unchanged.</desc><rect width="960" height="600" fill="#f4f3ed"/><text x="30" y="36" font-size="22" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">Schematic: what grows with n (not a timing chart)</text><text x="30" y="62" font-size="18" fill="#5d666d" text-anchor="start" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">n = sequence length, d = head dimension, w = window, h = heads. Areas show shape of cost, not measured time.</text><text x="30" y="110" font-size="20" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">Softmax, training</text><rect x="30" y="126" width="200" height="200" fill="#cfe0dd" stroke="#345e83" stroke-width="2"/><text x="130" y="232" font-size="20" fill="#345e83" text-anchor="middle" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">n × n scores</text><text x="130" y="354" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">compute O(n² d)</text><text x="130" y="378" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">scores memory O(n²)</text><text x="130" y="402" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">(per head, if stored)</text><text x="270" y="110" font-size="20" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">Sliding window</text><rect x="270" y="126" width="200" height="200" fill="none" stroke="#5d666d" stroke-dasharray="5 4"/><polygon points="270,126 300,126 470,296 470,326 440,326 270,156" fill="#cfe0dd" stroke="#427d77" stroke-width="2"/><text x="345" y="296" font-size="20" fill="#427d77" text-anchor="middle" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">n × w band</text><text x="370" y="354" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">compute O(n w d)</text><text x="370" y="378" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">memory O(n w)</text><text x="510" y="110" font-size="20" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">Linear / recurrent</text><rect x="510" y="126" width="200" height="200" fill="none" stroke="#5d666d" stroke-dasharray="5 4"/><rect x="510" y="126" width="40" height="40" fill="#ad8145" opacity="0.85"/><text x="615" y="152" font-size="20" fill="#ad8145" text-anchor="middle" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">d × d state</text><text x="610" y="232" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">per head, size fixed</text><text x="610" y="354" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">compute O(n d²)</text><text x="610" y="378" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">state O(d²), no n</text><text x="610" y="402" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">(recall is lossy)</text><text x="750" y="110" font-size="20" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">Decode: KV cache</text><rect x="750" y="126" width="30" height="200" fill="#cfe0dd" stroke="#345e83" stroke-width="2"/><rect x="790" y="126" width="30" height="200" fill="#cfe0dd" stroke="#345e83" stroke-width="2"/><text x="765" y="232" font-size="20" fill="#345e83" text-anchor="middle" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">K</text><text x="805" y="232" font-size="20" fill="#345e83" text-anchor="middle" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">V</text><text x="835" y="180" font-size="18" fill="#23364a" text-anchor="start" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">n × d</text><text x="835" y="204" font-size="18" fill="#23364a" text-anchor="start" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">each</text><text x="840" y="354" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">per new token:</text><text x="840" y="378" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">read O(n d) per KV head</text><text x="840" y="402" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">MQA/GQA/MLA: fewer</text><text x="840" y="426" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">or smaller KV heads</text><rect x="30" y="440" width="900" height="130" rx="6" fill="#ffffff" stroke="#b4c3c4"/><text x="46" y="470" font-size="20" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">FlashAttention changes none of the shapes above.</text><text x="46" y="498" font-size="18" fill="#23364a" text-anchor="start" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">It computes the same exact n × n softmax attention, in tiles, so the n × n matrix is never</text><text x="46" y="522" font-size="18" fill="#23364a" text-anchor="start" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">written to GPU main memory. Compute stays O(n² d); extra memory drops from O(n²) to O(n).</text><text x="46" y="552" font-size="18" fill="#427d77" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">Mixing rule: unchanged.   Cost class: unchanged.   Memory traffic: reduced.</text></svg>