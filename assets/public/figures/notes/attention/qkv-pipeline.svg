lvetica, sans-serif">0.00</text><text x="605.0" y="134.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">2.83</text><text x="473.0" y="166.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">2.83</text><text x="539.0" y="166.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">1.41</text><text x="605.0" y="166.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">4.24</text><text x="473.0" y="198.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">3.54</text><text x="539.0" y="198.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">0.71</text><text x="605.0" y="198.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">4.24</text><line x1="342" y1="148" x2="436" y2="140" stroke="#345e83" stroke-width="2"/><polygon points="436,140 427.2,144.7 426.5,136.9" fill="#345e83"/><line x1="342" y1="275" x2="436" y2="175" stroke="#427d77" stroke-width="2"/><polygon points="436,175 432.5,184.4 426.9,179.0" fill="#427d77"/><text x="730" y="100" font-size="18" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">A = softmax rows  (3×3)</text><rect x="730" y="112" width="198" height="96" fill="#ffffff" stroke="#23364a" stroke-width="2" rx="4"/><text x="763.0" y="134.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">0.486</text><text x="829.0" y="134.0" font-size=