f">(rounding to 3 decimals)</text><text x="730" y="330" font-size="18" fill="#23364a" text-anchor="start" font-weight="bold"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">O = A V  (3×2)</text><rect x="730" y="342" width="132" height="96" fill="#ffffff" stroke="#23364a" stroke-width="2" rx="4"/><text x="763.0" y="364.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">1.943</text><text x="829.0" y="364.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">1.543</text><text x="763.0" y="396.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">1.909</text><text x="829.0" y="396.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">1.859</text><text x="763.0" y="428.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">1.962</text><text x="829.0" y="428.0" font-size="18" fill="#23364a" text-anchor="middle" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">1.695</text><line x1="342" y1="418" x2="726" y2="392" stroke="#ad8145" stroke-width="2"/><polygon points="726,392 717.1,396.5 716.5,388.7" fill="#ad8145"/><rect x="30" y="480" width="900" height="104" rx="6" fill="#ffffff" stroke="#b4c3c4"/><text x="46" y="508" font-size="18" fill="#23364a" text-anchor="start" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">Row i of S and A: query token i.  Column j: key token j.</text><text x="46" y="534" font-size="18" fill="#23364a" text-anchor="start" font-weight="normal"  font-family="Liberation Sans, Arial, Helvetica, sans-serif">A[i, j] is how much token i reads from token j; each row of A sums