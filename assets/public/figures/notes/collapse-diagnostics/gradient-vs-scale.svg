<title id="t">Gradient size of four regulariser terms as a cloud shrinks towards a point</title><desc id="d">A log-log plot of gradient norm against the scale r of an isotropic Gaussian cloud, from 1 down to 1e-5. VICReg variance hinge on variance and SIGReg fall in proportion to r. VICReg hinge on standard deviation is constant until r is about 0.01 and then falls. VISReg scale term is constant. VISReg shape term grows as r falls.</desc>
