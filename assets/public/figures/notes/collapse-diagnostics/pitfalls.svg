<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">Two ways an effective-rank number can mislead</title><desc id="d">Left, a curve of measured effective rank against sample size for an isotropic 64-dimensional Gaussian: it is far below 64 for few samples. Right, horizontal bars of measured effective rank for five measurement situations on eight-dimensional data.</desc>
