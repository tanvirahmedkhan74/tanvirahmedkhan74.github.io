<title id="t">Covariance eigenvalue spectra of four eight-dimensional clouds on a log scale</title><desc id="d">Four bar charts of the eight covariance eigenvalues, log scale from 1e-7 to 10. The healthy cloud has eight bars near 1. The complete collapse has eight tiny bars near 1e-6. The dimensional collapse has two tall bars and six near 1e-6. The decorrelated dependent cloud has eight bars between 0.6 and 1.5.</desc>
