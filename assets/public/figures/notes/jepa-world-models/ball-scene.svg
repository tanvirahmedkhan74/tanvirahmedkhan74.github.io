<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">The running scene: a ball passes behind an occluder</title><desc id="d">Four frames. A ball rolls from the left, disappears behind a grey occluder in frames two and three, and reappears on the right in frame four.</desc>
<rect width="960" height="600" fill="#f4f3ed"/>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23364a"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ad8145"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#427d77"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#345e83"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d666d"/></marker></defs>
<text x="480.0" y="36.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="24" fill="#23364a" text-anchor="middle" font-weight="bold">Running scene: a ball rolls behind an occluder</text>
<rect x="44" y="80" width="200" height="150" fill="#fff" stroke="#b4c3c4" stroke-width="2" rx="4"/>
<circle cx="82.0" cy="155.0" r="22" fill="#ad8145"/>
<rect x="119" y="80" width="60" height="150" fill="#5d666d" stroke="#5d666d" stroke-width="1" rx="0"/>
<text x="144.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#23364a" text-anchor="middle" font-weight="normal">t = 0: visible</text>
<rect x="274" y="80" width="200" height="150" fill="#fff" stroke="#b4c3c4" stroke-width="2" rx="4"/>
<circle cx="354.0" cy="155.0" r="22" fill="#ad8145"/>
<rect x="349" y="80" width="60" height="150" fill="#5d666d" stroke="#5d666d" stroke-width="1" rx="0"/>
<text x="374.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#23364a" text-anchor="middle" font-weight="normal">t = 1: entering</text>
<rect x="504" y="80" width="200" height="150" fill="#fff" stroke="#b4c3c4" stroke-width="2" rx="4"/>
<rect x="579" y="80" width="60" height="150" fill="#5d666d" stroke="#5d666d" stroke-width="1" rx="0"/>
<circle cx="609" cy="155" r="22" fill="none" stroke="#ad8145" stroke-width="3" stroke-dasharray="5 4"/>
<text x="604.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#23364a" text-anchor="middle" font-weight="normal">t = 2: hidden</text>
<rect x="734" y="80" width="200" height="150" fill="#fff" stroke="#b4c3c4" stroke-width="2" rx="4"/>
<circle cx="902.0" cy="155.0" r="22" fill="#ad8145"/>
<rect x="809" y="80" width="60" height="150" fill="#5d666d" stroke="#5d666d" stroke-width="1" rx="0"/>
<text x="834.0" y="262.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#23364a" text-anchor="middle" font-weight="normal">t = 3: reappears</text>
<line x1="248.0" y1="155.0" x2="272.0" y2="155.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="478.0" y1="155.0" x2="502.0" y2="155.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="708.0" y1="155.0" x2="732.0" y2="155.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<text x="480.0" y="320.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#23364a" text-anchor="middle" font-weight="bold">The pixels under the occluder are not in the input.</text>
<text x="480.0" y="366.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">A pixel predictor must say what every hidden pixel looks like.</text>
<text x="480.0" y="402.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">A latent predictor must say what the scene state is: roughly where the ball is, how fast it moves.</text>
<text x="480.0" y="438.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Several states fit the same visible frame (the ball may stop, speed up or reverse),</text>
<text x="480.0" y="474.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">so the honest answer to “what happens next” is a distribution, not one image.</text>
<text x="480.0" y="560.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal">Every number in this note that uses this scene comes from a synthetic example made for the note.</text>
</svg>
