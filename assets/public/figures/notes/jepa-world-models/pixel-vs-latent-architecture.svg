<text x="564.0" y="131.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">context</text>
<rect x="654" y="80" width="120" height="66" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="714.0" y="119.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Encoder</text>
