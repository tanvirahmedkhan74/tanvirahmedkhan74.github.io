<line x1="775.0" y1="113.0" x2="803.0" y2="113.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="850.0" y1="147.0" x2="850.0" y2="219.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<rect x="294" y="220" width="152" height="66" fill="#fff" stroke="#ad8145" stroke-width="2" rx="8"/>
<text x="370.0" y="247.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Predicted</text>
<text x="370.0" y="271.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">pixels</text>
<rect x="774" y="220" width="152" height="66" fill="#fff" stroke="#427d77" stroke-width="2" rx="8"/>
<text x="850.0" y="247.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Predicted</text>
<text x="850.0" y="271.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">latent</text>
<rect x="24" y="220" width="230" height="66" fill="#fff" stroke="#ad8145" stroke-width="2" rx="8"/>
<text x="139.0" y="247.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Target: the hidden</text>
<text x="139.0" y="271.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">pixels themselves</text>
