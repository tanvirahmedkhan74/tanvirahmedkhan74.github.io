<text x="622.0" y="247.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Target patch through</text>
<text x="622.0" y="271.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">target encoder</text>
<text x="540.0" y="322.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="start" font-weight="normal">(EMA copy, no gradient)</text>
<line x1="139.0" y1="287.0" x2="139.0" y2="359.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="370.0" y1="287.0" x2="370.0" y2="359.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="522.0" y1="287.0" x2="522.0" y2="359.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="850.0" y1="287.0" x2="850.0" y2="359.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<rect x="24" y="360" width="422" height="54" fill="#fff" stroke="#23364a" stroke-width="2" rx="8"/>
<text x="235.0" y="393.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Loss: squared error on every pixel</text>
<rect x="504" y="360" width="422" height="54" fill="#fff" stroke="#23364a" stroke-width="2" rx="8"/>
<text x="715.0" y="393.6" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Loss: distance between latent vectors</text>
<text x="240.0" y="452.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="bold">To score well the model must match</text>
<text x="240.0" y="482.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">exact texture and lighting</text>
<text x="240.0" y="510.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">sensor noise in the hidden patch</text>
<text x="240.0" y="538.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">and where the ball is</text>
<text x="720.0" y="452.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="bold">To score well the model must produce</text>
<text x="720.0" y="482.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">whatever the target encoder keeps</text>
<text x="720.0" y="510.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">(this can include or drop texture:</text>
<text x="720.0" y="538.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">it depends on training)</text>
</svg>
