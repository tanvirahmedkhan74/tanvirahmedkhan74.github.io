<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">Predicting pixels versus predicting latents</title><desc id="d">Left: a masked-autoencoder style pipeline sends visible patches through an encoder and decoder and is scored on every hidden pixel. Right: a JEPA style pipeline sends context through an encoder and predictor, and the target comes from a separate target encoder; the loss is on latent features.</desc>
<rect width="960" height="600" fill="#f4f3ed"/>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23364a"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ad8145"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#427d77"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#345e83"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d666d"/></marker></defs>
<rect x="14" y="12" width="452" height="576" fill="none" stroke="#b4c3c4" stroke-width="2" rx="8"/>
<rect x="494" y="12" width="452" height="576" fill="none" stroke="#b4c3c4" stroke-width="2" rx="8"/>
<text x="240.0" y="46.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="23" fill="#23364a" text-anchor="middle" font-weight="bold">Predict pixels (MAE style)</text>
<text x="720.0" y="46.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="23" fill="#23364a" text-anchor="middle" font-weight="bold">Predict latents (JEPA style)</text>
<rect x="24" y="80" width="120" height="66" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="84.0" y="107.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Visible</text>
<text x="84.0" y="131.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">context</text>
<rect x="174" y="80" width="120" height="66" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="234.0" y="119.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Encoder</text>
<rect x="324" y="80" width="122" height="66" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="385.0" y="119.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Decoder</text>
<line x1="145.0" y1="113.0" x2="173.0" y2="113.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
