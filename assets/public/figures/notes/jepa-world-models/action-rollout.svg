<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">V-JEPA 2-AC: predicting, then planning</title><desc id="d">Top band, training: an encoder turns frames into latents and a predictor, given a state and an action, predicts the next latent; the loss compares it to the next frame latent. Bottom band, test time: sampled action sequences are rolled out in latent space and scored against a goal image latent; the best first action is executed and the loop repeats.</desc>
<rect width="960" height="600" fill="#f4f3ed"/>
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#23364a"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ad8145"/></marker><marker id="ah-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#427d77"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#345e83"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d666d"/></marker></defs>
<rect x="14" y="10" width="932" height="262" fill="none" stroke="#b4c3c4" stroke-width="2" rx="8"/>
<rect x="14" y="288" width="932" height="302" fill="none" stroke="#b4c3c4" stroke-width="2" rx="8"/>
<text x="28.0" y="40.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#23364a" text-anchor="start" font-weight="bold">Prediction (learned from robot video with actions)</text>
<rect x="30" y="70" width="150" height="62" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="105.0" y="95.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Frame</text>
<text x="105.0" y="119.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">x(t)</text>
<rect x="220" y="70" width="150" height="62" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="295.0" y="95.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Encoder E</text>
<text x="295.0" y="119.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">(frozen)</text>
<rect x="410" y="70" width="150" height="62" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="485.0" y="107.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Latent z(t)</text>
<rect x="220" y="176" width="150" height="62" fill="#cfe0dd" stroke="#ad8145" stroke-width="2" rx="8"/>
<text x="295.0" y="201.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Action a(t)</text>
<text x="295.0" y="225.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">and state s(t)</text>
<rect x="600" y="120" width="150" height="62" fill="#cfe0dd" stroke="#427d77" stroke-width="2" rx="8"/>
<text x="675.0" y="157.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Predictor P</text>
<rect x="780" y="120" width="150" height="62" fill="#fff" stroke="#427d77" stroke-width="2" rx="8"/>
<text x="855.0" y="145.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Predicted</text>
<text x="855.0" y="169.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">z(t+1)</text>
<line x1="181.0" y1="101.0" x2="219.0" y2="101.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="371.0" y1="101.0" x2="409.0" y2="101.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="561.0" y1="101.0" x2="599.0" y2="138.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="371.0" y1="207.0" x2="599.0" y2="166.0" stroke="#ad8145" stroke-width="2" marker-end="url(#ah-gold)" stroke-linecap="round"/>
<line x1="751.0" y1="151.0" x2="779.0" y2="151.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<text x="765.0" y="218.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal">L1 against the encoded</text>
<text x="765.0" y="240.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal">next frame z(t+1)</text>
<text x="28.0" y="322.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#23364a" text-anchor="start" font-weight="bold">Planning (test time, model weights fixed)</text>
<rect x="30" y="350" width="190" height="66" fill="#cfe0dd" stroke="#ad8145" stroke-width="2" rx="8"/>
<text x="125.0" y="377.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Sample candidate</text>
<text x="125.0" y="401.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">action sequences</text>
<rect x="260" y="350" width="210" height="66" fill="#cfe0dd" stroke="#427d77" stroke-width="2" rx="8"/>
<text x="365.0" y="377.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Roll P forward in</text>
<text x="365.0" y="401.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">latent space, T steps</text>
<rect x="510" y="350" width="200" height="66" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="610.0" y="377.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Energy: L1 distance</text>
<text x="610.0" y="401.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">to the goal latent</text>
<rect x="750" y="350" width="180" height="66" fill="#cfe0dd" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="840.0" y="377.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Keep the best</text>
<text x="840.0" y="401.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">sequence</text>
<line x1="221.0" y1="383.0" x2="259.0" y2="383.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="471.0" y1="383.0" x2="509.0" y2="383.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<line x1="711.0" y1="383.0" x2="749.0" y2="383.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<rect x="510" y="470" width="200" height="62" fill="#fff" stroke="#345e83" stroke-width="2" rx="8"/>
<text x="610.0" y="495.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Goal image</text>
<text x="610.0" y="519.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">through E</text>
<line x1="610.0" y1="469.0" x2="610.0" y2="418.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<rect x="750" y="470" width="180" height="62" fill="#cfe0dd" stroke="#ad8145" stroke-width="2" rx="8"/>
<text x="840.0" y="495.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">Execute the first</text>
<text x="840.0" y="519.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#23364a" text-anchor="middle" font-weight="normal">action only</text>
<line x1="840.0" y1="418.0" x2="840.0" y2="469.0" stroke="#23364a" stroke-width="2" marker-end="url(#ah-ink)" stroke-linecap="round"/>
<path d="M840 533 L840 566 L125 566 L125 418" fill="none" stroke="#5d666d" stroke-width="2" marker-end="url(#ah-grey)" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480.0" y="556.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="middle" font-weight="normal">observe the new frame, then plan again</text>
<text x="150.0" y="462.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="start" font-weight="normal">The sampler is a search method</text>
<text x="150.0" y="484.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="start" font-weight="normal">(the paper uses the cross-entropy</text>
<text x="150.0" y="506.0" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#5d666d" text-anchor="start" font-weight="normal">method).</text>
</svg>
