<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">Five families of self-supervised learning, shown as a branching map</title><desc id="d">Five horizontal threads: contrastive methods, teacher-target methods without negatives, pixel reconstruction, latent-space prediction (the JEPA family) and distribution-regularised embeddings. Dashed arrows mark shared ideas, not prerequisites.</desc>
