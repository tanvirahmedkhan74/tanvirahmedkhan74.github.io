<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Representation, readout and constrained repair</title><desc id="desc">A frozen reranker produces a representation. The trained scoring head uses part of what is encoded; a supervised readout asks how much more can be recovered. The difference between them is the gap the study examines, and constrained sparse weight repair is the intervention under test. No measured recovery or repair result is shown.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="58" font-size="38" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">What does the scoring head leave unused?</text><rect x="40" y="120" width="170" height="70" rx="10" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="125.0" y="164.1" font-size="26" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Evidence pair</text><path d="M218,155 L242,155" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M230,147 L242,155 L230,163" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="112" width="180" height="86" rx="12" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><text x="340" y="150" font-size="28" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Reranker</text><text x="340" y="180" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="italic">frozen</text><path d="M438,155 L462,155" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M450,147 L462,155 L450,163" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="664" y="110" font-size="26" fill="#23364a" text-anchor="middle" font-weight="600