" font-style="normal">how much more can be read out?</text><path d="M726,240 L748,240 L748,410 L726,410" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><text x="764" y="316" font-size="23" fill="#ad8145" text-anchor="start" font-weight="400" font-style="normal">gap under</text><text x="764" y="344" font-size="23" fill="#ad8145" text-anchor="start" font-weight="400" font-style="normal">study</text><rect x="150" y="474" width="660" height="58" rx="10" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><text x="480" y="511" font-size="26" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Constrained sparse weight repair, gated by capacity</text><text x="480" y="566" font-size="24" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">A conceptual comparison; no measured recovery or repair result is shown.</text></g></svg>