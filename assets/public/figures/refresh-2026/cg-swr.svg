<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Representation and readout</title><desc id="desc">Conceptual comparison of how an evidence encoder is used by an adapted readout and by a constrained weight edit. Neither branch indicates a successful repair.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="82" font-size="38" fill="#23364a" text-anchor="middle" font-weight="600">What does the scoring head leave unused?</text><rect x="65" y="202" width="230" height="112" rx="12" fill="#e4eceb" stroke="#bccacb" stroke-width="2"/><text x="180.0" y="269.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Evidence</text><path d="M309,258 L350,258" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round"/><path d="M339,251 L350,258 L339,265" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="365" y="202" width="230" height="112" rx="12" fill="#e4eceb" stroke="#bccacb" stroke-width="2"/><text x="480.0" y="269.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Encoder</text><path d="M595 258 H630 V164 H662 M630 258 V381 H662" fill="none" stroke="#345e83" stroke-width="4"/><path d="M644,164 L662,164" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round"/><path d="M651,157 L662,164 L651,171" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M644,381 L662,381" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round"/><path d="M651,374 L662,381 L651,388" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="672" y="116" width="224" height="96" rx="12" fill="#e2e9ed" stroke="#bccacb" stroke-width="2"/><text x="784.0" y="175.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Readout</text><rect x="672" y="333" width="224" height="96" rx="12" fill="#e4ebe4" stroke="#bccacb" stroke-width="2"/><text x="784.0" y="392.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Weight edit</text><text x="480" y="511" font-size="28" fill="#6a747b" text-anchor="middle" font-weight="400">Compare representation, readout and constrained repair.</text></g></svg>