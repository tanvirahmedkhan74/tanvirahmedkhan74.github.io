<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc"><title id="title">A small input step and a discrete feature choice</title><desc id="desc">With the selection left free a small input step can change which feature index is chosen; with the selection held fixed it cannot. Conceptual; no measured sensitivity.</desc><rect width="360" height="400" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="180" y="34" font-size="24" fill="#345e83" text-anchor="middle" font-weight="600">Selection left free</text><rect x="26" y="48" width="60" height="54" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="56" y="84" font-size="25" fill="#345e83" text-anchor="middle" font-weight="600">A</text><rect x="26" y="48" width="60" height="54" rx="8" fill="none" stroke="#345e83" stroke-width="4"/><rect x="94" y="48" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="124" y="84" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">B</text><rect x="162" y="48" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="192" y="84" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">C</text><text x="258" y="84" font-size="23" fill="#5d666d" text-anchor="start" font-weight="400">x</text><rect x="26" y="116" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="56" y="152" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">A</text><rect x="94" y="116" width="60" height="54" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="124" y="152" font-size="25" fill="#345e83" text-anchor="middle" font-weight="600">B</text><rect x="94" y="116" width="60" height="54" rx="8" fill="none" stroke="#345e83" stroke-width="4"/><rect x="162" y="116" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="192" y="152" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">C</text><text x="258" y="152" font-size="23" fill="#5d666d" text-anchor="start" font-weight="400">x + ε</text><text x="180" y="224" font-size="24" fill="#427d77" text-anchor="middle" font-weight="600">Selection held fixed</text><rect x="26" y="238" width="60" height="54" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="56" y="274" font-size="25" fill="#427d77" text-anchor="middle" font-weight="600">A</text><rect x="26" y="238" width="60" height="54" rx="8" fill="none" stroke="#427d77" stroke-width="4"/><rect x="94" y="238" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="124" y="274" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">B</text><rect x="162" y="238" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="192" y="274" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">C</text><text x="258" y="274" font-size="23" fill="#5d666d" text-anchor="start" font-weight="400">x</text><rect x="26" y="306" width="60" height="54" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="56" y="342" font-size="25" fill="#427d77" text-anchor="middle" font-weight="600">A</text><rect x="26" y="306" width="60" height="54" rx="8" fill="none" stroke="#427d77" stroke-width="4"/><rect x="94" y="306" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="124" y="342" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">B</text><rect x="162" y="306" width="60" height="54" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="192" y="342" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400">C</text><text x="258" y="342" font-size="23" fill="#5d666d" text-anchor="start" font-weight="400">x + ε</text><path d="M24,194 L336,194" fill="none" stroke="#b4c3c4" stroke-width="2" stroke-linecap="round" st