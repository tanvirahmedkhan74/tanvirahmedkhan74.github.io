<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc"><title id="title">Changing and fixed choices</title><desc id="desc">Conceptual comparison of a probe that can change a selection and one whose choice is held fixed.</desc><rect width="360" height="400" fill="#f4f3ed"/><text x="180" y="49" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#345e83">Switching choice</text><rect x="36" y="79" width="73" height="78" rx="9" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><rect x="143" y="79" width="73" height="78" rx="9" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><rect x="250" y="79" width="73" height="78" rx="9" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><rect x="36" y="79" width="73" height="78" rx="9" fill="none" stroke="#345e83" stroke-width="4"/><rect x="143" y="79" width="73" height="78" rx="9" fill="none" stroke="#345e83" stroke-width="4"/><path d="M53 185L306 185" fill="none" stroke="#345e83" stroke-width="3" stroke-linecap="round"/><path d="M298 179L306 185L298 191" fill="none" stroke="#345e83" stroke-width="3"/><text x="180" y="245" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#427d77">Fixed choice</text><rect x="36" y="274" width="73" height="78" rx="9" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><rect x="143" y="274" width="73" height="78" rx="9" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><rect x="250" y="274" width="73" height="78" rx="9" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><rect x="36" y="274" width="73" height="78" rx="9" fill="none" stroke="#427d77" stroke-width="4"/><path d="M53 380L306 380" fill="none" stroke="#427d77" stroke-width="3" stroke-linecap="round"/><path d="M298 374L306 380L298 386" fill="none" stroke="#427d77" stroke-width="3"/></svg>