<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">A probe and a discrete choice</title><desc id="desc">Conceptual contrast between a probe that can change a feature selection and a probe whose selection is held fixed. No measured response curves are shown.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="84" font-size="37" fill="#23364a" text-anchor="middle" font-weight="600">What changes when a discrete choice changes?</text><text x="258" y="173" font-size="31" fill="#345e83" text-anchor="middle" font-weight="400">Choice may switch</text><text x="702" y="173" font-size="31" fill="#427d77" text-anchor="middle" font-weight="400">Choice held fixed</text><rect x="85" y="221" width="94" height="98" rx="8" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><text x="132" y="284" font-size="36" fill="#23364a" text-anchor="middle" font-weight="400">A</text><rect x="200" y="221" width="94" height="98" rx="8" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><text x="247" y="284" font-size="36" fill="#23364a" text-anchor="middle" font-weight="400">B</text><rect x="315" y="221" width="94" height="98" rx="8" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><text x="362" y="284" font-size="36" fill="#23364a" text-anchor="middle" font-weight="400">C</text><rect x="529" y="221" width="94" height="98" rx="8" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><text x="576" y="284" font-size="36" fill="#23364a" text-anchor="middle" font-weight="400">A</text><rect x="644" y="221" width="94" height="98" rx="8" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><text x="691" y="284" font-size="36" fill="#23364a" text-anchor="middle" font-weight="400">B</text><rect x="759" y="221" width="94" height="98" rx="8" fill="#fffef9" stroke="#bccacb" stroke-width="2"/><text x="806" y="284" font-size="36" fill="#23364a" text-anchor="middle" font-weight="400">C</text><rect x="85" y="221" width="94" height="98" rx="8" fill="none" stroke="#345e83" stroke-width="5"/><rect x="200" y="221" width="94" height="98" rx="8" fill="none" stroke="#345e83" stroke-width="5"/><rect x="529" y="221" width="94" height="98" rx="8" fill="none" stroke="#427d77" stroke-width="5"/><path d="M135,370 L392,370" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round"/><path d="M381,363 L392,370 L381,377" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M579,370 L836,370" fill="none" stroke="#427d77" stroke-width="4" stroke-linecap="round"/><path d="M825,363 L836,370 L825,377" fill="none" stroke="#427d77" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="478" font-size="31" fill="#6a747b" text-anchor="middle" font-weight="400">Separate local response from selection changes.</text></g></svg>