<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">A probe, a small step and a discrete feature choice</title><desc id="desc">Two arms of the same probe. In the first, a small input step can change which feature index is selected, so the measured difference mixes a new discrete choice with the local response. In the second the selected index is held fixed, so the difference reflects the local response only. No measured sensitivity is shown.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="58" font-size="32" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">When does a small input step cross a hidden choice?</text><text x="480" y="96" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">A probe moves the input by a small step. A hard feature selection may move with it.</text><text x="56" y="158" font-size="27" fill="#345e83" text-anchor="start" font-weight="600" font-style="normal">Selection left free</text><text x="442" y="158" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">input x</text><rect x="330" y="172" width="68" height="72" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="364" y="218" font-size="30" fill="#345e83" text-anchor="middle" font-weight="600" font-style="normal">A</text><rect x="330" y="172" width="68" height="72" rx="8" fill="none" stroke="#345e83" stroke-width="5"/><rect x="408" y="172" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="442" y="218" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">B</text><rect x="486" y="172" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="520" y="218" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">C</text><text x="442" y="274" font-size="23" fill="#345e83" text-anchor="middle" font-weight="400" font-style="normal">selected: A</text><text x="752" y="158" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">input x + ε</text><rect x="640" y="172" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="674" y="218" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">A</text><rect x="718" y="172" width="68" height="72" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="752" y="218" font-size="30" fill="#345e83" text-anchor="middle" font-weight="600" font-style="normal">B</text><rect x="718" y="172" width="68" height="72" rx="8" fill="none" stroke="#345e83" stroke-width="5"/><rect x="796" y="172" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="830" y="218" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">C</text><text x="752" y="274" font-size="23" fill="#345e83" text-anchor="middle" font-weight="400" font-style="normal">selected: B</text><path d="M572,208 L622,208" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M610,200 L622,208 L610,216" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="597" y="190" font-size="24" fill="#345e83" text-anchor="middle" font-weight="400" font-style="normal">ε</text><text x="56" y="310" font-size="22" fill="#5d666d" text-anchor="start" font-weight="400" font-style="normal">The measured difference mixes a new discrete choice with the local response.</text><text x="56" y="372" font-size="27" fill="#427d77" text-anchor="start" font-weight="600" font-style="normal">Selection held fixed</text><text x="442" y="372" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">input x</text><rect x="330" y="386" width="68" height="72" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="364" y="432" font-size="30" fill="#427d77" text-anchor="middle" font-weight="600" font-style="normal">A</text><rect x="330" y="386" width="68" height="72" rx="8" fill="none" stroke="#427d77" stroke-width="5"/><rect x="408" y="386" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="442" y="432" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">B</text><rect x="486" y="386" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="520" y="432" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">C</text><text x="442" y="488" font-size="23" fill="#427d77" text-anchor="middle" font-weight="400" font-style="normal">selected: A</text><text x="752" y="372" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">input x + ε</text><rect x="640" y="386" width="68" height="72" rx="8" fill="#e8eef1" stroke="#b4c3c4" stroke-width="2"/><text x="674" y="432" font-size="30" fill="#427d77" text-anchor="middle" font-weight="600" font-style="normal">A</text><rect x="640" y="386" width="68" height="72" rx="8" fill="none" stroke="#427d77" stroke-width="5"/><rect x="718" y="386" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="752" y="432" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">B</text><rect x="796" y="386" width="68" height="72" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="830" y="432" font-size="30" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">C</text><text x="752" y="488" font-size="23" fill="#427d77" text-anchor="middle" font-weight="400" font-style="normal">selected: A</text><path d="M572,422 L622,422" fill="none" stroke="#427d77" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M610,414 L622,422 L610,430" fill="none" stroke="#427d77" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="597" y="404" font-size="24" fill="#427d77" text-anchor="middle" font-weight="400" font-style="normal">ε</text><text x="56" y="524" font-size="22" fill="#5d666d" text-anchor="start" font-weight="400" font-style="normal">The measured difference reflects the local response only.</text><path d="M56,336 L904,336" fill="none" stroke="#b4c3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><text x="480" y="568" font-size="24" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">A conceptual contrast. No response curve or measured sensitivity is shown.</text></g></svg>