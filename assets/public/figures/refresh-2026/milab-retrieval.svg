<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Retrieval, conditioning and the commit deadline</title><desc id="desc">A timeline with the moment a conversational turn is committed. Lookups that land before it can shape the reply; those after it cannot. Retrieval and conditioning are drawn as separate concerns so a retrieval failure can be distinguished from a timing failure. A conceptual view of major team work with no measured latency.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="60" font-size="36" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">A lookup is only useful before the turn is committed</text><text x="480" y="98" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">Retrieval here is a scheduling problem as much as a search problem.</text><path d="M70,250 L890,250" fill="none" stroke="#23364a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="292" font-size="22" fill="#5d666d" text-anchor="start" font-weight="400" font-style="normal">time</text><path d="M560,170 L560,330" fill="none" stroke="#345e83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><text x="560" y="150" font-size="24" fill="#345e83" text-anchor="middle" font-weight="400" font-style="normal">turn committed</text><rect x="90" y="196" width="440" height="54" rx="8" fill="#dfebe7" stroke="none" stroke-width="2"/><text x="310" y="231" font-size="24" fill="#427d77" text-anchor="middle" font-weight="400" font-style="normal">lookup can still shape the reply</text><rect x="590" y="196" width="300" height="54" rx="8" fill="#ece6db" stroke="none" stroke-width="2"/><text x="740" y="231" font-size="24" fill="#876435" text-anchor="middle" font-weight="400" font-style="normal">too late to use</text><circle cx="140" cy="250" r="9" fill="#427d77"/><circle cx="250" cy="250" r="9" fill="#427d77"/><circle cx="360" cy="250" r="9" fill="#427d77"/><circle cx="470" cy="250" r="9" fill="#427d77"/><circle cx="620" cy="250" r="9" fill="none" stroke="#ad8145" stroke-width="3"/><circle cx="730" cy="250" r="9" fill="none" stroke="#ad8145" stroke-width="3"/><circle cx="840" cy="250" r="9" fill="none" stroke="#ad8145" stroke-width="3"/><rect x="90" y="372" width="360" height="86" rx="12" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="270" y="408" font-size="26" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Retrieval and tools</text><text x="270" y="440" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">external information, fetched</text><rect x="530" y="372" width="360" height="86" rx="12" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="710" y="408" font-size="26" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Conditioning</text><text x="710" y="440" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">what actually reaches the turn</text><path d="M454,415 L524,415" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M512,407 L524,415 L512,423" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M566,368 L566,284" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M558,291 L566,280 L574,291" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="520" font-size="24" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Kept as separate concerns so that a retrieval failure and a timing failure</text><text x="480" y="550" font-size="24" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">can be told apart. A major team effort; no measured latency is shown.</text></g></svg>