<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Fitting, motion and rendering as separable causes</title><desc id="desc">Fitting, motion and rendering are drawn as three separate stages that can each produce the same unwanted head motion in the output. Varying one while holding the other two fixed is what distinguishes them. A conceptual view of the investigation with no measured result.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="60" font-size="36" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Three stages that can each cause the same wobble</text><text x="480" y="98" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">Separating them is what makes a stability problem diagnosable.</text><rect x="60" y="150" width="240" height="150" rx="14" fill="#fffef9" stroke="#427d77" stroke-width="3"/><text x="180" y="196" font-size="30" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Fitting</text><text x="180" y="232" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">where the face is,</text><text x="180" y="260" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">frame by frame</text><rect x="360" y="150" width="240" height="150" rx="14" fill="#fffef9" stroke="#345e83" stroke-width="3"/><text x="480" y="196" font-size="30" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Motion</text><text x="480" y="232" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">how it is allowed</text><text x="480" y="260" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">to move</text><rect x="660" y="150" width="240" height="150" rx="14" fill="#fffef9" stroke="#ad8145" stroke-width="3"/><text x="780" y="196" font-size="30" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Rendering</text><text x="780" y="232" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">how it is drawn</text><path d="M310,225 L344,225" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M332,217 L344,225 L332,233" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M610,225 L644,225" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M632,217 L644,225 L632,233" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="350" width="840" height="96" rx="12" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><text x="480" y="390" font-size="27" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Unwanted head motion in the output</text><text x="480" y="424" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">The same symptom can originate in any of the three stages above.</text><path d="M180,302 L180,344" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M172,337 L180,348 L188,337" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M480,302 L480,344" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M472,337 L480,348 L488,337" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M780,302 L780,344" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M772,337 L780,348 L788,337" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="480" y="492" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Varying one stage while the other two are held fixed is what tells them apart.</text><text x="480" y="546" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">Conceptual view of the investigation; no measured stability result is shown.</text></g></svg>