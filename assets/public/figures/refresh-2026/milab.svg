<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Conversational avatar workflow</title><desc id="desc">Conceptual workflow from a speech model through a motion bridge to frame rendering, with coordination on a shared device. It illustrates several stages of lab work rather than one fixed implementation.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="84" font-size="40" fill="#23364a" text-anchor="middle" font-weight="600">From conversation to a moving avatar</text><rect x="81" y="181" width="330" height="112" rx="12" fill="#e2e9ed" stroke="#bccacb" stroke-width="2"/><text x="246.0" y="248.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Speech model</text><path d="M425,237 L519,237" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round"/><path d="M508,230 L519,237 L508,244" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="181" width="344" height="112" rx="12" fill="#e4ebe4" stroke="#bccacb" stroke-width="2"/><text x="708.0" y="248.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Motion bridge</text><path d="M708 307 V344 H246 V361 L238 351 M246 361 L254 351" fill="none" stroke="#345e83" stroke-width="4"/><rect x="81" y="363" width="330" height="112" rx="12" fill="#ece6db" stroke="#bccacb" stroke-width="2"/><text x="246.0" y="430.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Render frames</text><text x="681" y="420" font-size="32" fill="#23364a" text-anchor="middle" font-weight="400">Shared device</text><text x="480" y="544" font-size="30" fill="#6a747b" text-anchor="middle" font-weight="400">Coordinate models, queues and playback.</text></g></svg>