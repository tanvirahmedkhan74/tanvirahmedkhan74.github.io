<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Conversational avatar stages on a shared device</title><desc id="desc">Speech generation, a motion bridge, a renderer and playback run as connected stages inside one shared device budget, each chunk handed on while the next is still being produced. Retrieval and tool calling supply the conversation. It is a conceptual view of several stages of lab work rather than one fixed implementation, and shows no measured system performance.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="58" font-size="38" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">From conversation to a moving avatar</text><rect x="42" y="110" width="876" height="232" rx="18" fill="none" stroke="#345e83" stroke-width="3" stroke-dasharray="9 7"/><text x="70" y="146" font-size="26" fill="#345e83" text-anchor="start" font-weight="600" font-style="normal">Shared device</text><text x="890" y="146" font-size="22" fill="#5d666d" text-anchor="end" font-weight="400" font-style="normal">one compute and latency budget</text><rect x="70" y="176" width="178" height="104" rx="12" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><text x="159" y="220" font-size="28" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Speech</text><text x="159" y="254" font-size="28" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">model</text><path d="M256,228 L282,228" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M270,220 L282,228 L270,236" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="292" y="176" width="178" height="104" rx="12" fill="#e4ebe4" stroke="#b4c3c4" stroke-width="2"/><text x="381" y="220" font-size="28" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Motion</text><text x="381" y="254" font-size="28" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">bridge</text><path d="M478,228 L504,228" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M492,220 L504,228 L492,236" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="514" y="176" width="178" height="104" rx="12" fill="#ece6db" stroke="#b4c3c4" stroke-width="2"/><text x="603" y="237" font-size="28" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Renderer</text><path d="M700,228 L726,228" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M714,220 L726,228 L714,236" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="736" y="176" width="178" height="104" rx="12" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><text x="825" y="237" font-size="28" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Playback</text><text x="480" y="320" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">Each chunk is handed on while the next one is still being produced.</text><rect x="66" y="404" width="356" height="68" rx="12" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="244" y="446" font-size="26" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Retrieval and tool calling</text><path d="M244,400 L244,364" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M244,364 L244,364 L244,364" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M236,374 L244,364 L252,374" fill="none" stroke="#ad8145" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="446" font-size="23" fill="#5d666d" text-anchor="start" font-weight="400" font-style="normal">supplies the conversation</text><text x="480" y="528" font-size="25" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">Conceptual view of several stages of our lab work,</text><text x="480" y="560" font-size="25" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">not one fixed implementation or measured system.</text></g></svg>