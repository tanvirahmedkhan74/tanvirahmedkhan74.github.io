><rect x="150.0" y="308" width="60" height="34" rx="7" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><circle cx="180.0" cy="325" r="8" fill="#f4f3ed" stroke="#427d77" stroke-width="2.5"/><path d="M180,96 L180,130" fill="none" stroke="#345e83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M173,121 L180,130 L187,121" fill="none" stroke="#345e83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M180,226 L180,260" fill="none" stroke="#345e83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M173,251 L180,260 L187,251" fill="none" stroke="#345e83" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="54" cy="378" r="8" fill="#427d77" stroke="none" stroke-width="2.5"/><text x="68" y="385" font-size="21" fill="#5d666d" text-anchor="start" font-weight="400">support</text><rect x="170" y="368" width="20" height="20" rx="5" fill="#f4f3ed" stroke="#ad8145" stroke-width="2" stroke-dasharray="5 4"/><text x="198" y="385" font-size="21" fill="#5d666d" text-anchor="start" font-weight="400">lost here</text></g></svg>