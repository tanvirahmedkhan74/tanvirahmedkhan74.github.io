 stroke="none" stroke-width="2"/><path d="M480 265 V310 L472 300 M480 310 L488 300" fill="none" stroke="#345e83" stroke-width="4"/><rect x="111" y="332" width="300" height="108" rx="12" fill="#e4eceb" stroke="#bccacb" stroke-width="2"/><text x="261.0" y="397.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Organize memory</text><path d="M425,386 L519,386" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round"/><path d="M508,379 L519,386 L508,393" fill="none" stroke="#345e83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="536" y="332" width="300" height="108" rx="12" fill="#e4eceb" stroke="#bccacb" stroke-width="2"/><text x="686.0" y="397.0" font-size="34" fill="#23364a" text-anchor="middle" font-weight="400">Retrieve by query</text><text x="480" y="520" font-size="30" fill="#6a747b" text-anchor="middle" font-weight="400">Observe over time. Find the relevant moment.</text></g></svg>