<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Where supporting evidence can be lost in multi-hop QA</title><desc id="desc">Three stages of a multi-hop answer pipeline: candidate access, evidence selection and reading. The illustration marks the three distinct places where supporting evidence can be lost, including support that reaches the reader but is not used. It is a conceptual diagram of the research question and shows no measured result.</desc><rect width="960" height="600" fill="#f4f3ed"/><g font-family="Arial, Helvetica, sans-serif"><text x="480" y="62" font-size="38" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Where does supporting evidence disappear?</text><rect x="58" y="100" width="224" height="300" rx="14" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="170" y="142" font-size="32" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Access</text><text x="170" y="172" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">retrieved candidates</text><rect x="368" y="100" width="224" height="300" rx="14" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="480" y="142" font-size="32" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Select</text><text x="480" y="172" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">kept candidates</text><rect x="678" y="100" width="224" height="300" rx="14" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><text x="790" y="142" font-size="32" fill="#23364a" text-anchor="middle" font-weight="600" font-style="normal">Read</text><text x="790" y="172" font-size="23" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">used by the reader</text><rect x="92" y="200" width="70" height="42" rx="7" fill="#cfe0dd" stroke="#427d77" stroke-width="2"/><circle cx="127" cy="221" r="9" fill="#427d77" stroke="none" stroke-width="3"/><rect x="178" y="200" width="70" height="42" rx="7" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><rect x="92" y="258" width="70" height="42" rx="7" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><rect x="178" y="258" width="70" height="42" rx="7" fill="#f4f3ed" stroke="#ad8145" stroke-width="2" stroke-dasharray="5 4"/><circle cx="213" cy="279" r="9" fill="#f4f3ed" stroke="#ad8145" stroke-width="3"/><rect x="92" y="316" width="70" height="42" rx="7" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><rect x="178" y="316" width="70" height="42" rx="7" fill="#cfe0dd" stroke="#427d77" stroke-width="2"/><circle cx="213" cy="337" r="9" fill="#427d77" stroke="none" stroke-width="3"/><rect x="402" y="206" width="156" height="42" rx="7" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><rect x="402" y="264" width="156" height="42" rx="7" fill="#cfe0dd" stroke="#427d77" stroke-width="2"/><circle cx="480" cy="285" r="9" fill="#427d77" stroke="none" stroke-width="3"/><rect x="402" y="322" width="156" height="42" rx="7" fill="#f4f3ed" stroke="#ad8145" stroke-width="2" stroke-dasharray="5 4"/><circle cx="480" cy="343" r="9" fill="#f4f3ed" stroke="#ad8145" stroke-width="3"/><rect x="712" y="200" width="156" height="100" rx="8" fill="#fffef9" stroke="#b4c3c4" stroke-width="2"/><circle cx="790" cy="234" r="10" fill="#f4f3ed" stroke="#427d77" stroke-width="3"/><text x="790" y="282" font-size="22" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">supplied</text><rect x="712" y="322" width="156" height="48" rx="10" fill="#e4eceb" stroke="#b4c3c4" stroke-width="2"/><text x="790.0" y="354.75" font-size="25" fill="#23364a" text-anchor="middle" font-weight="400" font-style="normal">Answer</text><path d="M292,250 L356,250" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M344,242 L356,250 L344,258" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M602,250 L666,250" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M654,242 L666,250 L654,258" fill="none" stroke="#345e83" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="152" cy="440" r="9" fill="#427d77" stroke="none" stroke-width="3"/><text x="170" y="448" font-size="22" fill="#5d666d" text-anchor="start" font-weight="400" font-style="normal">supporting evidence</text><rect x="406" y="428" width="24" height="24" rx="5" fill="#f4f3ed" stroke="#ad8145" stroke-width="2" stroke-dasharray="5 4"/><text x="440" y="448" font-size="22" fill="#5d666d" text-anchor="start" font-weight="400" font-style="normal">lost at this stage</text><circle cx="662" cy="440" r="9" fill="#f4f3ed" stroke="#427d77" stroke-width="3"/><text x="680" y="448" font-size="22" fill="#5d666d" text-anchor="start" font-weight="400" font-style="normal">present but unused</text><text x="480" y="508" font-size="27" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">Support can be missed at retrieval, dropped at selection,</text><text x="480" y="542" font-size="27" fill="#5d666d" text-anchor="middle" font-weight="400" font-style="normal">or supplied to a reader that does not use it.</text></g></svg>